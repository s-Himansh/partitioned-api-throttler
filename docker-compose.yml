services:
  throttler:
    build: .
    container_name: throttler
    ports:
      - "8080:8080"
    command: ["--addr=:8080", "--partitions=64", "--limit=10", "--window=1m"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - throttler