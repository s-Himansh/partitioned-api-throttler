groups:
  - name: throttler_alerts
    rules:
      - alert: HighThrottleRate
        expr: api_throttler_throttle_rate{partition="global"} > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High throttle rate detected"
          description: "Throttle rate is {{ $value | humanizePercentage }} (threshold: 80%)"

      - alert: TooManyActiveIPs
        expr: api_throttler_active_ips > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many active IPs"
          description: "{{ $value }} active IPs being tracked (threshold: 10,000)"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.99, rate(api_throttler_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "P99 request latency is too high"
          description: "P99 latency is {{ $value }}s (threshold: 1s)"

      - alert: ServiceDown
        expr: up{job="partitioned-api-throttler"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Throttler service is down"
          description: "The throttler has been unreachable for more than 30 seconds"
